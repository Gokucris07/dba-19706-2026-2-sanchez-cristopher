# ---------------------------------------------------------------------------
# pg_hba.conf del laboratorio (Unidad II)
# Reglas de autenticación de PostgreSQL. Se evalúan de arriba hacia abajo.
# ---------------------------------------------------------------------------
# TYPE      DATABASE  USER  ADDRESS      METHOD

# Dentro del contenedor (socket Unix): solo el usuario del sistema operativo
# con el mismo nombre que el rol (docker exec -u postgres ... psql).
local       all       all                peer

# Conexiones por red: SOLO con TLS y contraseña verificada con SCRAM-SHA-256.
hostssl     all       all   0.0.0.0/0    scram-sha-256
hostssl     all       all   ::/0         scram-sha-256

# Cualquier conexión por red SIN TLS se rechaza.
hostnossl   all       all   0.0.0.0/0    reject
hostnossl   all       all   ::/0         reject
